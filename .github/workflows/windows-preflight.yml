name: Detroit 313 Windows preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preflight:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source validator unit tests
        run: python -m unittest discover -s tests -v
      - name: Check optional Detroit source archive
        shell: pwsh
        run: |
          if (Test-Path inputs/Detroit313_Source.zip) {
            python scripts/audit_source.py --source inputs/Detroit313_Source.zip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python scripts/audit_detroit_bundle.py inputs/Detroit313_Source.zip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "::notice::No Detroit source archive in repository. Source package validation skipped."
          }
      - name: Explain compiler boundary
        shell: pwsh
        run: |
          Write-Host "Preflight only: no Blender scene or ReSkate map compiled."
          Write-Host "Do not commit or upload unlicensed Studio/game binaries into this public repository."
