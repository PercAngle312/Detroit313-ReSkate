name: Detroit 313 Source Bundle CI

on:
  push:
    paths:
      - 'inputs/Detroit313_Source.zip'
      - 'scripts/**'
      - '.github/workflows/detroit-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate source ZIP if uploaded
        shell: bash
        run: |
          if [ ! -f inputs/Detroit313_Source.zip ]; then
            echo "::notice::Upload the Detroit313_Source.zip source archive to inputs/ to activate the source package gate."
            exit 0
          fi
          python scripts/audit_source.py --source inputs/Detroit313_Source.zip
          python scripts/audit_detroit_bundle.py inputs/Detroit313_Source.zip
          python scripts/inventory_detroit_assets.py inputs/Detroit313_Source.zip > inventory.json
          python - <<'PY'
          import json
          report=json.load(open('inventory.json'))
          assert report['valid'], report
          print('Verified',len(report['assets']),'required source files')
          PY
      - name: Save source manifest
        if: hashFiles('inputs/Detroit313_Source.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: detroit313-source-inventory
          path: inventory.json
          retention-days: 7
